services:

  db:
    image: pgvector/pgvector:pg16
    container_name: MusicBot_DB
    restart: unless-stopped
    environment:
      POSTGRES_DB:       MusicBot
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d MusicBot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: MusicBot_Ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 120s

  ollama-init:
    image: ollama/ollama:latest
    container_name: MusicBot_Ollama_Init
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo 'Aguardando Ollama iniciar...';
        sleep 10;
        ollama pull gemma4:e4b;
        echo 'Modelos baixados com sucesso!';
      "
    restart: "no"

  backend:
    build: ./backend
    container_name: MusicBot_backend
    restart: unless-stopped
    environment:
      # PYTHONUNBUFFERED: "1"
      DATABASE_URL:          postgresql://admin:admin@db:5432/MusicBot
      APP_SECRET_KEY:        musicbot-dev-secret-key
      JWT_SECRET_KEY:        ${JWT_SECRET_KEY:-musicbot-jwt-secret-32-chars-ok!}
      SPOTIFY_CLIENT_ID:     ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      HUGGINGFACE_TOKEN:     ${HUGGINGFACE_TOKEN}
      SPOTIFY_REDIRECT_URI:  http://127.0.0.1:8080/api/auth/callback
      FRONTEND_URL:          http://127.0.0.1:8080
      OLLAMA_BASE_URL:       http://ollama:11434
      OLLAMA_MODEL:          gemma4:e4b
      OLLAMA_KEEP_ALIVE:     10m
      # IFES Colatina
      LLM_PROVIDER:          ${LLM_PROVIDER:-local}
      IFES_BASE_URL:         ${IFES_BASE_URL:-https://workstations.chatbotintegracar.online}
      IFES_API_KEY:          ${IFES_API_KEY}
      IFES_MODEL:            ${IFES_MODEL:-gemma3:12b}
      IFES_EMBEDDING_MODEL:   ${IFES_EMBEDDING_MODEL:-embeddinggemma:latest}
      # LangChain OpenAI precisa da API Key explicitamente para ChatOpenAI
      OPENAI_API_KEY:        ${IFES_API_KEY}
      OPENAI_BASE_URL:       ${IFES_BASE_URL:-https://workstations.chatbotintegracar.online}/v1
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: MusicBot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@musicbot.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: MusicBot_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  tunnel:
    build: ./tunnel
    container_name: MusicBot_Tunnel
    restart: unless-stopped
    depends_on:
      - frontend
    profiles:
      - tunnel

volumes:
  db_data:
  ollama_data:
  pgadmin_data:
